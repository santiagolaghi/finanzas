<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>Finanzas Pro</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f5f7fa;--surface:#fff;--surface2:#f0f3f7;--text:#111827;--muted:#667085;
  --line:#e5e7eb;--primary:#2563eb;--primary2:#1d4ed8;--green:#16a34a;--red:#dc2626;
  --amber:#d97706;--purple:#7c3aed;--shadow:0 8px 30px rgba(16,24,40,.07);
  --radius:16px;--sidebar:248px;
}
[data-theme="dark"]{
  --bg:#0b0f14;--surface:#11161d;--surface2:#171d25;--text:#f3f4f6;--muted:#98a2b3;
  --line:#252d38;--primary:#60a5fa;--primary2:#3b82f6;--green:#4ade80;--red:#f87171;
  --amber:#fbbf24;--purple:#a78bfa;--shadow:0 10px 35px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
body{font-size:15px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar);background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;z-index:30}
.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 25px;font-weight:800;font-size:19px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:900}
.nav{display:grid;gap:5px}
.nav button{border:0;background:transparent;color:var(--muted);padding:12px 13px;border-radius:11px;text-align:left;font-weight:650;display:flex;gap:11px;align-items:center}
.nav button:hover{background:var(--surface2);color:var(--text)}
.nav button.active{background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary)}
.nav .ico{width:22px;text-align:center}
.sidebar-bottom{margin-top:auto;display:grid;gap:8px}
.mini-btn{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:10px 12px;border-radius:10px;text-align:left}
.main{margin-left:var(--sidebar);min-height:100vh}
.topbar{height:72px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 30px}
.top-title h1{margin:0;font-size:20px}.top-title p{margin:3px 0 0;color:var(--muted);font-size:12px}
.top-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:40px;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:10px;color:var(--text)}
.content{max-width:1320px;margin:0 auto;padding:28px 30px 90px}
.view{display:none}.view.active{display:block}
.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.stat{padding:18px}.stat .label{color:var(--muted);font-size:12px;font-weight:650}.stat .value{font-size:24px;font-weight:800;margin-top:7px;letter-spacing:-.5px}.stat .sub{font-size:12px;color:var(--muted);margin-top:6px}
.dashboard-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-top:16px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.card-head h2{font-size:15px;margin:0}.card-body{padding:20px}
.muted{color:var(--muted)}.positive{color:var(--green)}.negative{color:var(--red)}.warning{color:var(--amber)}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;min-height:42px}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary2)}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.btn-danger{background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red)}
.btn-small{min-height:34px;padding:7px 10px;font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.progress{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}.progress>span{display:block;height:100%;border-radius:inherit;background:var(--primary)}
.kpi-row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.kpi-row:last-child{border-bottom:0}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 14px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}.table td{font-size:13px}.table tr:last-child td{border-bottom:0}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:750;background:var(--surface2);color:var(--muted)}.badge.green{background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green)}.badge.red{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}.badge.amber{background:color-mix(in srgb,var(--amber) 15%,transparent);color:var(--amber)}.badge.blue{background:color-mix(in srgb,var(--primary) 14%,transparent);color:var(--primary)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:11px 12px;outline:0}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 13%,transparent)}.field textarea{min-height:86px;resize:vertical}.money-input{display:flex;align-items:center;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;overflow:hidden}.money-input:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 13%,transparent)}.money-input .currency{padding-left:12px;font-weight:700;color:var(--muted);user-select:none}.money-input input{border:0!important;box-shadow:none!important;border-radius:0;padding-left:7px}.money-input input:focus{outline:0}
.checkbox{display:flex;align-items:center;gap:8px;padding-top:26px}.checkbox input{width:18px;height:18px}
.toolbar{display:flex;gap:9px;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap}.search{max-width:340px;flex:1}.search input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text)}
.empty{padding:38px 15px;text-align:center;color:var(--muted)}
.chart-box{height:310px;position:relative}.chart-box.small{height:250px}.chart-box.donut{height:340px}.chart-center{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center;padding:80px}.chart-center strong{font-size:20px}.chart-center span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.chart-toolbar{display:flex;align-items:center;gap:8px}.card-dates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}.date-box{padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--surface2)}.date-box .label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:750}.date-box .date{font-weight:800;margin-top:4px}.date-box .hint{font-size:10px;color:var(--muted);margin-top:3px}.card-date-alert{margin-top:12px}.date-input-help{font-size:11px;color:var(--muted);margin-top:5px}
.month-box{display:flex;align-items:center;gap:8px}.month-box input{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:9px 11px;border-radius:10px}
.alert{padding:14px 16px;border-radius:12px;margin-bottom:16px;background:var(--surface2);border:1px solid var(--line)}.alert strong{display:block;margin-bottom:4px}.subcat{margin:7px 0 0;padding-left:16px;font-size:12px;color:var(--muted)}.category-group{border:1px solid var(--line);border-radius:14px;padding:15px}.category-group+.category-group{margin-top:10px}.category-title{display:flex;align-items:center;justify-content:space-between;gap:10px}.category-sublist{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.sub-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;background:var(--surface2);font-size:11px;color:var(--muted)}
.goal{padding:15px 0;border-bottom:1px solid var(--line)}.goal:last-child{border-bottom:0}.goal-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px}
.card-list{display:grid;gap:10px}.list-card{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;justify-content:space-between;gap:12px;align-items:center}.list-main{min-width:0}.list-title{font-weight:750}.list-meta{font-size:12px;color:var(--muted);margin-top:4px}.list-actions{display:flex;gap:6px}
.bottom-nav{display:none}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}.modal-back.open{display:flex}.modal{width:min(620px,100%);max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 90px rgba(0,0,0,.25)}.modal .card-head{position:sticky;top:0;background:var(--surface);z-index:2}.modal-body{padding:20px}
.toast{position:fixed;right:20px;bottom:20px;z-index:200;background:#111827;color:#fff;padding:12px 15px;border-radius:11px;box-shadow:0 15px 40px rgba(0,0,0,.25);display:none;max-width:360px}.toast.show{display:block}.toast.ok{background:#166534}.toast.err{background:#991b1b}
.spinner{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}@keyframes spin{to{transform:rotate(360deg)}}
.mobile-only{display:none}
@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.dashboard-grid{grid-template-columns:1fr}.sidebar{width:220px}.main{margin-left:220px}.form-grid.three{grid-template-columns:1fr 1fr}}
@media(max-width:720px){
  :root{--sidebar:0px}
  .sidebar{display:none}.main{margin-left:0}.topbar{height:64px;padding:0 16px}.top-title h1{font-size:17px}.top-title p{display:none}.content{padding:18px 14px 90px}.stats{grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px}.stat .value{font-size:19px}.dashboard-grid{gap:10px}.card-head{padding:15px}.card-body{padding:15px}.form-grid,.form-grid.three{grid-template-columns:1fr}.checkbox{padding-top:0}.card-dates{grid-template-columns:1fr 1fr}.card-dates .date-box:last-child{grid-column:1/-1}.bottom-nav{display:grid;position:fixed;bottom:0;left:0;right:0;height:66px;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);grid-template-columns:repeat(5,1fr);z-index:40;padding-bottom:env(safe-area-inset-bottom)}.bottom-nav button{border:0;background:transparent;color:var(--muted);font-size:10px;font-weight:700}.bottom-nav button.active{color:var(--primary)}.bottom-nav span{display:block;font-size:18px;margin-bottom:2px}.mobile-only{display:block}.desktop-only{display:none}.toolbar{align-items:stretch}.search{max-width:none}.table th:nth-child(4),.table td:nth-child(4){display:none}}

.landing-mode .sidebar,.landing-mode .bottom-nav,.landing-mode .topbar{display:none}
.landing-mode .main{margin-left:0}
.landing{min-height:calc(100vh - 80px);display:grid;place-items:center;padding:40px 18px}
.landing-inner{width:min(980px,100%)}
.landing-brand{display:flex;align-items:center;gap:12px;margin-bottom:34px}
.landing-brand .brand-mark{width:44px;height:44px;border-radius:13px}
.landing-title{font-size:clamp(30px,5vw,48px);letter-spacing:-1.5px;margin:0}
.landing-sub{font-size:15px;color:var(--muted);margin:8px 0 0}
.month-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:22px}
.month-card{padding:20px;border:1px solid var(--line);background:var(--surface);border-radius:16px;box-shadow:var(--shadow);text-align:left;transition:.18s transform,.18s border-color}
.month-card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--primary) 50%,var(--line))}
.month-card .month-icon{width:42px;height:42px;border-radius:12px;background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary);display:grid;place-items:center;font-size:19px;margin-bottom:17px}
.month-card h3{margin:0;font-size:16px}.month-card p{margin:5px 0 0;color:var(--muted);font-size:12px}
.month-create{margin-top:20px;border:1px dashed var(--line);background:transparent;box-shadow:none}
.month-create:hover{border-color:var(--primary)}
.month-create .month-icon{background:var(--surface2)}
.landing-empty{padding:28px;border:1px dashed var(--line);border-radius:16px;background:var(--surface)}
.month-current{display:flex;align-items:center;gap:8px}
.month-current .badge{font-size:12px}
@media(max-width:720px){.landing{min-height:100vh;padding:28px 14px}.landing-inner{width:100%}.landing-title{font-size:32px}.month-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brand-mark">₣</div><span>Finanzas Pro</span></div>
  <nav class="nav" id="sideNav"></nav>
  <div class="sidebar-bottom">
    <button class="mini-btn" onclick="toggleTheme()">◐ Apariencia</button>
    <button class="mini-btn" onclick="backup()">↓ Crear backup</button>
  </div>
</aside>

<main class="main">
<header class="topbar">
  <div class="top-title"><h1 id="pageTitle">Resumen</h1><p id="pageSubtitle">Tu situación financiera de este mes</p></div>
  <div class="top-actions">
    <div class="month-current"><span class="badge blue" id="currentMonthBadge">Sin mes</span><button class="btn btn-secondary btn-small" onclick="showLanding()">Cambiar mes</button></div>
    <button class="icon-btn" title="Tema" onclick="toggleTheme()">◐</button>
  </div>
</header>

<section class="content">
  <div id="view-home" class="view"></div>
  <div id="view-dashboard" class="view active"></div>
  <div id="view-transactions" class="view"></div>
  <div id="view-categories" class="view"></div>
  <div id="view-budgets" class="view"></div>
  <div id="view-cards" class="view"></div>
  <div id="view-recurring" class="view"></div>
  <div id="view-history" class="view"></div>
</section>
</main>
</div>

<nav class="bottom-nav" id="bottomNav"></nav>
<div class="modal-back" id="modalBack" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="card-head"><h2 id="modalTitle">Editar</h2><button class="icon-btn" onclick="closeModal()">×</button></div><div class="modal-body" id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbz7tPq7V8ygibl9VCS1UwJ04jD_8lJxjNdQMMeBWZ-hZNgh3XE041zEOhhJbCa5_RnO/exec';
let state = {mesId:'',mes:'',ingresos:[],gastos:[],categorias:[],tarjetas:[],recurrentes:[],presupuestos:{},balance:{},meta:{},historial:[]};
let currentView='dashboard', charts={}, busy=false, monthCache=[];

const NAV=[
 {id:'dashboard',icon:'⌂',label:'Resumen'},
 {id:'transactions',icon:'↕',label:'Movimientos'},
 {id:'categories',icon:'◫',label:'Categorías'},
 {id:'budgets',icon:'◎',label:'Presupuesto'},
 {id:'cards',icon:'▣',label:'Tarjetas'},
 {id:'recurring',icon:'↻',label:'Recurrentes'},
 {id:'history',icon:'◷',label:'Historial'}
];

function initNav(){
 const side=document.getElementById('sideNav'), bottom=document.getElementById('bottomNav');
 side.innerHTML=NAV.map(n=>`<button id="nav-${n.id}" onclick="go('${n.id}')"><span class="ico">${n.icon}</span>${n.label}</button>`).join('');
 bottom.innerHTML=NAV.slice(0,5).map(n=>`<button id="bnav-${n.id}" onclick="go('${n.id}')"><span>${n.icon}</span>${n.label}</button>`).join('');
}
function go(v){
 if(v!=='home'&&!state.mesId){showLanding();return}
 document.body.classList.remove('landing-mode');
 currentView=v;if(v!=='dashboard')window.__categoryDrill='';
 document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
 document.getElementById('view-'+v).classList.add('active');
 document.querySelectorAll('.nav button,.bottom-nav button').forEach(x=>x.classList.remove('active'));
 document.getElementById('nav-'+v)?.classList.add('active');
 document.getElementById('bnav-'+v)?.classList.add('active');
 const n=NAV.find(x=>x.id===v);
 document.getElementById('pageTitle').textContent=n.label;
 document.getElementById('pageSubtitle').textContent={
  dashboard:'Tu situación financiera de este mes',transactions:'Ingresos y gastos',categories:'Organizá tus gastos',budgets:'Controlá cuánto podés gastar',cards:'Consumos y cierres',recurring:'Pagos e ingresos automáticos',history:'Meses anteriores'
 }[v];
 render();
}

function money(n){return new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(n)||0)}
function formatMoney(n){return new Intl.NumberFormat('es-AR',{maximumFractionDigits:0}).format(Number(n)||0)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Argentina/Buenos_Aires',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function formatDateDisplay(value){
  const s=String(value||'').slice(0,10);
  const m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m?`${m[3]}/${m[2]}/${m[1]}`:(value||'—');
}
function monthNow(){return today().slice(0,7)}
function toast(msg,type='ok'){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show '+type;clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.className='toast',3000)}
function setBusy(v){busy=v}
function api(action,params={}){
 return new Promise((resolve,reject)=>{
   if(API.includes('PEGAR_AQUI')) return reject(new Error('Falta configurar la URL del Web App'));
   const finalParams={...params};
   const publicActions=new Set(['getMeses','crearMes','renombrarMes','getHistorial','hacerBackup']);
   if(state.mesId && !publicActions.has(action)) finalParams.mesId=state.mesId;
   const callback='fin_cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);
   const q=new URLSearchParams({action,callback,...Object.fromEntries(Object.entries(finalParams).map(([k,v])=>[k,typeof v==='object'?JSON.stringify(v):String(v)]))});
   const script=document.createElement('script');
   const timer=setTimeout(()=>{cleanup();reject(new Error('Tiempo de espera agotado'))},15000);
   function cleanup(){clearTimeout(timer);delete window[callback];script.remove()}
   window[callback]=(data)=>{cleanup();if(data?.ok===false)reject(new Error(data.error||'Error'));else resolve(data)};
   script.onerror=()=>{cleanup();reject(new Error('No se pudo conectar con Google Sheets'))};
   script.src=API+'?'+q.toString();
   document.body.appendChild(script);
 });
}

async function load(){
 try{
   if(!state.mesId) return showLanding();
   const d=await api('getDatos');
   state={...state,...d};
   if(currentView==='history'){const history=await api('getHistorial');state.historial=history.historial||[];}
   updateCurrentMonthUI();
   render();
 }catch(e){toast(e.message,'err')}
}
async function mutate(action,params={},success='Guardado'){
 try{setBusy(true);await api(action,params);await load();toast(success)}catch(e){toast(e.message,'err')}finally{setBusy(false)}
}
function updateCurrentMonthUI(){
 const b=document.getElementById('currentMonthBadge');
 if(b)b.textContent=state.mes||'Sin mes';
}
async function showLanding(){
 currentView='home';
 document.body.classList.add('landing-mode');
 document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
 const home=document.getElementById('view-home');home.classList.add('active');
 try{
   const d=await api('getMeses');
   monthCache=d.meses||[];
   renderLanding(monthCache);
 }catch(e){renderLanding([]);toast(e.message,'err')}
}
function renderLanding(months){
 const home=document.getElementById('view-home');
 home.innerHTML=`<div class="landing"><div class="landing-inner">
   <div class="landing-brand"><div class="brand-mark">₣</div><div><h1 class="landing-title">Finanzas Pro</h1><p class="landing-sub">Elegí el mes con el que querés trabajar.</p></div></div>
   ${months.length?`<div class="month-grid">${months.map(m=>`<button class="month-card" onclick="selectMonth('${esc(m.id)}')"><span class="month-icon">◷</span><h3>${esc(m.nombre)}</h3><p>Todo lo que cargues queda guardado dentro de este mes.</p></button>`).join('')}
   <button class="month-card month-create" onclick="openCreateMonth()"><span class="month-icon">+</span><h3>Crear nuevo mes</h3><p>Empezá un período completamente independiente.</p></button></div>`
   :`<div class="landing-empty"><strong>Todavía no existe ningún mes.</strong><p class="muted">Para empezar, creá tu primer mes. Después, todo lo que cargues quedará guardado dentro de él.</p><button class="btn btn-primary" onclick="openCreateMonth()">+ Crear mi primer mes</button></div>`}
 </div></div>`;
}
async function selectMonth(mesId){
 try{
   let m=monthCache.find(x=>x.id===mesId);
   if(!m){const months=await api('getMeses');monthCache=months.meses||[];m=monthCache.find(x=>x.id===mesId);}
   if(!m)throw new Error('Ese mes ya no existe');

 const surface=document.getElementById('categoryChart');
 if(!surface)return;
 window.__categoryChartLabels=[]; window.__categoryChartIds=[];const el=document.getElementById('categoryChart');if(!el)return;const root=!window.__categoryDrill;const items=root?categoryTotals():subcategoryTotals(window.__categoryDrill);const total=items.reduce((a,x)=>a+x.total,0);const title=document.getElementById('categoryChartTitle'),sub=document.getElementById('categoryChartSubtitle'),back=document.getElementById('categoryChartBack'),center=document.getElementById('categoryChartTotal'),label=document.getElementById('categoryChartCenterLabel'),badge=document.getElementById('categoryDetailBadge'),list=document.getElementById('categoryDetailList');if(title)title.textContent=root?'Gastos por categoría':`Detalle · ${state.categorias.find(c=>c.id===window.__categoryDrill)?.nombre||'Categoría'}`;if(sub)sub.textContent=root?'Hacé clic en una categoría para ver sus subcategorías.':'Volvé a categorías para elegir otra.';if(back)back.style.display=root?'none':'inline-flex';if(center)center.textContent=money(total);if(label)label.textContent=root?'Total registrado':'Total de la categoría';if(badge)badge.textContent=root?'Por categoría':'Por subcategoría';const colors=chartPalette(items.length);if(list)list.innerHTML=items.length?items.map((x,i)=>`<div class="kpi-row"><span style="display:flex;align-items:center;gap:8px"><span style="width:9px;height:9px;border-radius:50%;background:${colors[i]};display:inline-block"></span>${esc(x.nombre)}</span><strong>${money(x.total)}</strong></div>`).join(''):'<div class="empty">Todavía no hay gastos clasificados para mostrar.</div>';if(charts.category)charts.category.destroy();if(!items.length)return;charts.category=new Chart(el,{type:'doughnut',data:{labels:items.map(x=>x.nombre),datasets:[{data:items.map(x=>x.total),backgroundColor:colors,borderWidth:3,borderColor:surface,hoverOffset:8}]},options:{responsive:true,maintainAspectRatio:false,cutout:'68%',plugins:{legend:{position:'bottom',labels:{color:text,usePointStyle:true,padding:14,font:{size:11}}},tooltip:{callbacks:{label:ctx=>` ${ctx.label}: ${money(ctx.raw)}`}}},onClick:(_,elements)=>{if(!root||!elements.length)return;window.__categoryDrill=items[elements[0].index].id;renderCategoryChart()}}});}
function showCategoryChartRoot(){window.__categoryDrill='';renderCategoryChart()}

function openModal(title,html){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modalBack').classList.add('open')}
function closeModal(){document.getElementById('modalBack').classList.remove('open')}

function formatMoneyInput(el){
  if(!el)return;
  let v=String(el.value||'').replace(/\s/g,'').replace(/[^0-9,]/g,'');
  const parts=v.split(',');
  let integer=(parts[0]||'').replace(/^0+(?=\d)/,'');
  const decimal=parts.length>1?','+(parts[1]||'').slice(0,2):'';
  integer=integer.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  el.value=integer+decimal;
}
function parseMoneyInput(value){
  const v=String(value??'').replace(/\./g,'').replace(',','.');
  return Number(v)||0;
}
function openTransaction(type,data=null){const ing=type==='ingreso',x=data||{};const cats=state.categorias||[],subs=state.subcategorias||[];openModal(ing?'Nuevo ingreso':'Nuevo gasto',`<div class="form-grid"><div class="field"><label>Concepto</label><input id="fConcepto" value="${esc(x.concepto)}"></div><div class="field"><label>Monto</label><div class="money-input"><span class="currency">$</span><input id="fMonto" type="text" inputmode="decimal" autocomplete="off" value="${x.monto?formatMoney(x.monto):''}" oninput="formatMoneyInput(this)" placeholder="0"></div></div><div class="field"><label>Fecha</label><input id="fFecha" type="date" value="${x.fecha||today()}"></div>${ing?'':`<div class="field"><label>Categoría</label><select id="fCategoria" onchange="refreshSubcategorySelect()"><option value="">Seleccionar...</option>${cats.map(c=>`<option value="${c.id}" ${c.id===x.categoriaId?'selected':''}>${esc(c.nombre)}</option>`).join('')}</select></div><div class="field"><label>Subcategoría</label><select id="fSubcategoria"><option value="">Sin subcategoría</option>${subs.filter(s=>s.categoriaId===x.categoriaId).map(s=>`<option value="${s.id}" ${s.id===x.subcategoriaId?'selected':''}>${esc(s.nombre)}</option>`).join('')}</select></div><div class="field"><label>Tarjeta</label><select id="fTarjeta"><option value="">No es tarjeta</option>${state.tarjetas.map(c=>`<option value="${c.id}" ${c.id===x.tarjetaId?'selected':''}>${esc(c.nombre)}</option>`).join('')}</select></div><div class="field"><label>Pagado por</label><select id="fPago"><option value="compartido" ${x.pagoPor==='compartido'?'selected':''}>Compartido</option><option value="yo" ${x.pagoPor==='yo'?'selected':''}>Yo</option><option value="ella" ${x.pagoPor==='ella'?'selected':''}>Mi pareja</option></select></div>`}<div class="checkbox"><input id="fEstado" type="checkbox" ${ing?(x.estado!==false?'checked':''):(x.estado!==false?'checked':'')}><label for="fEstado">${ing?'Cobrado':'Pagado'}</label></div><div class="field" style="grid-column:1/-1"><label>Nota</label><textarea id="fNota">${esc(x.nota)}</textarea></div></div><div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="submitTransaction('${type}','${x.id||''}')">Guardar</button></div>`)}
function refreshSubcategorySelect(){const cat=document.getElementById('fCategoria')?.value||'',sel=document.getElementById('fSubcategoria');if(!sel)return;sel.innerHTML='<option value="">Sin subcategoría</option>'+(state.subcategorias||[]).filter(s=>s.categoriaId===cat).map(s=>`<option value="${s.id}">${esc(s.nombre)}</option>`).join('')}
async function submitTransaction(type,id){const ing=type==='ingreso';const p={id,concepto:document.getElementById('fConcepto').value,monto:parseMoneyInput(document.getElementById('fMonto').value),fecha:document.getElementById('fFecha').value,nota:document.getElementById('fNota').value};if(ing)p.cobrado=document.getElementById('fEstado').checked;else{p.pagado=document.getElementById('fEstado').checked;p.categoriaId=document.getElementById('fCategoria').value;p.subcategoriaId=document.getElementById('fSubcategoria').value;p.tarjetaId=document.getElementById('fTarjeta').value;p.pagoPor=document.getElementById('fPago').value}if(!p.concepto.trim()||p.monto<=0||(!ing&&!p.categoriaId))return toast('Completá los campos obligatorios','err');await mutate(id?(ing?'actualizarIngreso':'actualizarGasto'):(ing?'agregarIngreso':'agregarGasto'),p,ing?'Ingreso guardado':'Gasto guardado');closeModal()}
function editTx(type,id){const x=(type==='ingreso'?state.ingresos:state.gastos).find(a=>a.id===id);openTransaction(type,x)}
function openCategory(x=null){openModal(x?'Editar categoría':'Nueva categoría',`<div class="field"><label>Nombre</label><input id="catName" value="${esc(x?.nombre||'')}"></div><div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="submitCategory('${x?.id||''}')">Guardar</button></div>`)}
function editCategory(id){openCategory(state.categorias.find(x=>x.id===id))}
async function submitCategory(id){const nombre=document.getElementById('catName').value.trim();if(!nombre)return toast('Escribí un nombre','err');await mutate(id?'actualizarCategoria':'agregarCategoria',{id,nombre},'Categoría guardada');closeModal()}
function openSubcategory(x=null,catId=''){const currentCat=x?.categoriaId||catId;openModal(x?'Editar subcategoría':'Nueva subcategoría',`<div class="form-grid"><div class="field"><label>Categoría principal</label><select id="subCatParent">${state.categorias.map(c=>`<option value="${c.id}" ${c.id===currentCat?'selected':''}>${esc(c.nombre)}</option>`).join('')}</select></div><div class="field"><label>Nombre</label><input id="subName" value="${esc(x?.nombre||'')}"></div></div><div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="submitSubcategory('${x?.id||''}')">Guardar</button></div>`)}
function editSubcategory(id){openSubcategory(state.subcategorias.find(x=>x.id===id))}
async function submitSubcategory(id){const nombre=document.getElementById('subName').value.trim(),categoriaId=document.getElementById('subCatParent').value;if(!nombre||!categoriaId)return toast('Completá los campos','err');await mutate(id?'actualizarSubcategoria':'agregarSubcategoria',{id,nombre,categoriaId},'Subcategoría guardada');closeModal()}
function openCard(x=null){const nextDefault=x?.vencimientoSiguiente||'';openModal(x?'Editar tarjeta':'Nueva tarjeta',`<div class="form-grid"><div class="field"><label>Nombre</label><input id="cNombre" value="${esc(x?.nombre||'')}"></div><div class="field"><label>Banco</label><input id="cBanco" value="${esc(x?.banco||'')}"></div><div class="field"><label>Tipo</label><select id="cTipo"><option ${x?.tipo==='Crédito'?'selected':''}>Crédito</option><option ${x?.tipo==='Débito'?'selected':''}>Débito</option></select></div><div class="field"><label>Fecha de cierre · mes actual</label><input id="cCierre" type="date" value="${esc(x?.cierre||'')}"><div class="date-input-help">Hasta esta fecha, las compras normalmente entran en el próximo resumen.</div></div><div class="field"><label>Vencimiento · mes actual</label><input id="cVenc" type="date" value="${esc(x?.vencimiento||'')}"><div class="date-input-help">Es la fecha en la que tenés que pagar este resumen.</div></div><div class="field"><label>Vencimiento siguiente</label><input id="cVencNext" type="date" value="${esc(nextDefault)}"><div class="date-input-help">Se convertirá automáticamente en el vencimiento actual al crear el próximo mes.</div></div></div><div class="checkbox"><input id="cAutoNext" type="checkbox" checked><label for="cAutoNext">Calcular automáticamente el siguiente vencimiento si está vacío</label></div><div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="submitCard('${x?.id||''}')">Guardar</button></div>`);setTimeout(()=>{syncNextCardDue();document.getElementById('cVenc')?.addEventListener('change',()=>{const n=document.getElementById('cVencNext');if(document.getElementById('cAutoNext')?.checked&&n&&!n.value)syncNextCardDue()})},0)}
function syncNextCardDue(){const current=document.getElementById('cVenc')?.value,next=document.getElementById('cVencNext'),auto=document.getElementById('cAutoNext');if(!current||!next||!auto?.checked||next.value)return;if(/^\d{4}-\d{2}-\d{2}$/.test(current)){const d=new Date(current+'T12:00:00');d.setMonth(d.getMonth()+1);next.value=d.toISOString().slice(0,10)}}
function editCard(id){openCard(state.tarjetas.find(x=>x.id===id))}
async function submitCard(id){syncNextCardDue();const nextEl=document.getElementById('cVencNext');const p={id,nombre:document.getElementById('cNombre').value.trim(),banco:document.getElementById('cBanco').value.trim(),tipo:document.getElementById('cTipo').value,cierre:document.getElementById('cCierre').value||'',vencimiento:document.getElementById('cVenc').value||'',vencimientoSiguiente:nextEl?.value||''};if(!p.nombre)return toast('Escribí un nombre','err');if(p.vencimiento&&p.vencimientoSiguiente&&p.vencimientoSiguiente<=p.vencimiento)return toast('El vencimiento siguiente debe ser posterior al actual','err');await mutate(id?'actualizarTarjeta':'agregarTarjeta',p,'Tarjeta guardada');closeModal()}

function openRecurring(x=null){openModal(x?'Editar recurrente':'Nuevo recurrente',`<div class="form-grid"><div class="field"><label>Tipo</label><select id="rTipo"><option value="gasto" ${x?.tipo!=='ingreso'?'selected':''}>Gasto</option><option value="ingreso" ${x?.tipo==='ingreso'?'selected':''}>Ingreso</option></select></div><div class="field"><label>Concepto</label><input id="rConcepto" value="${esc(x?.concepto||'')}"></div><div class="field"><label>Monto</label><div class="money-input"><span class="currency">$</span><input id="rMonto" type="text" inputmode="decimal" autocomplete="off" value="${x?.monto?formatMoney(x.monto):''}" oninput="formatMoneyInput(this)" placeholder="0"></div></div><div class="field"><label>Día del mes</label><input id="rDia" type="number" min="1" max="31" value="${x?.dia||1}"></div><div class="field"><label>Categoría</label><select id="rCat"><option value="">Sin categoría</option>${state.categorias.map(c=>`<option value="${c.id}" ${x?.categoriaId===c.id?'selected':''}>${esc(c.nombre)}</option>`).join('')}</select></div><div class="field"><label>Persona</label><select id="rPago"><option value="compartido">Compartido</option><option value="yo">Yo</option><option value="ella">Mi pareja</option></select></div></div><div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="submitRecurring('${x?.id||''}')">Guardar</button></div>`)}
function editRecurring(id){openRecurring(state.recurrentes.find(x=>x.id===id))}
async function submitRecurring(id){const p={id,tipo:document.getElementById('rTipo').value,concepto:document.getElementById('rConcepto').value.trim(),monto:parseMoneyInput(document.getElementById('rMonto').value),dia:Number(document.getElementById('rDia').value)||1,categoriaId:document.getElementById('rCat').value,pagoPor:document.getElementById('rPago').value};if(!p.concepto||p.monto<=0)return toast('Completá los campos','err');await mutate(id?'actualizarRecurrente':'agregarRecurrente',p,'Recurrente guardado');closeModal()}
