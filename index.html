ng{font-size:18px}.sub-price span{font-size:10px;color:var(--muted);margin-left:6px}.accounts-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0}.account-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px;display:grid;grid-template-columns:auto 1fr;gap:12px}.account-card .list-actions{grid-column:1/-1}.account-icon{font-size:24px}.account-card span{display:block;font-size:11px;color:var(--muted)}.account-card h3{margin:7px 0}.future-strip{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.future-strip>div{padding:13px;background:var(--surface2);border-radius:12px}.future-strip span,.future-strip small{display:block;color:var(--muted);font-size:10px}.future-strip strong{display:block;margin:5px 0}.diagnostic{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.diagnostic span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--amber) 14%,transparent);color:var(--amber);font-weight:900}.diagnostic.error span{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}.diagnostic p{margin:3px 0;font-size:12px}.advanced-box{border:1px solid var(--line);border-radius:12px;background:var(--surface2);overflow:hidden}.advanced-box summary{cursor:pointer;padding:12px 14px;font-weight:750}.advanced-inner{padding:14px;border-top:1px solid var(--line)}.actions.end{justify-content:flex-end;margin-top:16px}.soft{border:0;border-top:1px solid var(--line);margin:18px 0}.pin-lock{position:fixed;inset:0;z-index:1000;background:var(--bg);display:grid;place-items:center}.pin-card{width:min(360px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:25px;box-shadow:var(--shadow);text-align:center}.pin-card .brand-mark{margin:auto}.pin-card input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin:12px 0}.pin-card button{width:100%}.pin-card s <body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brand-mark">₣</div><span>Finanzas Pro</span></div>
  <nav class="nav" id="sideNav"></nav>
  <div class="sidebar-bottom">
    <button class="mini-btn" onclick="toggleTheme()">◐ Apariencia</button>

  </div>

<main class="main">

  <div class="top-actions">
    <div class="month-current"><span class="badge blue" id="currentMonthBadge">Sin mes</span><button class="btn btn-secondary btn-small" onclick="showLanding()">Cambiar mes</button></div>

  </div>
</header>

<section class="content">
  <div id="view-home" class="view"></div>
  <div id="view-dashboard" class="view active"></div>
  <div id="view-transactions" class="view"></div>
  <div id="view-categories" class="view"></div>
  <div id="view-budgets" class="view"></div>
  <div id="view-cards" class="view"></div>
  <div id="view-recurring" class="view"></div>
  <div id="view-debts" class="view"></div>
  <div id="view-accounts" class="view"></div>
  <div id="view-planning" class="view"></div>
  <div id="view-control" class="view"></div>
  <div id="view-history" class="view"></div>
</section>
</main>
</div>

<nav class="bottom-nav" id="bottomNav"></nav>
<div class="modal-back" id="modalBack" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="card-head"><h2 id="modalTitle">Editar</h2><button class="icon-btn" onclick="closeModal()">×</button></div><div class="modal-body" id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbz7tPq7V8ygibl9VCS1UwJ04jD_8lJxjNdQMMeBWZ-hZNgh3XE041zEOhhJbCa5_RnO/exec';
let state = {mesId:'',mes:'',ingresos:[],gastos:[],categorias:[],subcategorias:[],tarjetas:[],recurrentes:[],deudas:[],cuentas:[],objetivos:[],reservas:[],reglas:[],porCobrar:[],transferencias:[],cierres:[],presupuestos:{},balance:{},meta:{},historial:[]};
let currentView='dashboard', charts={}, busy=false, monthCache=[];
let txFilters={q:'',from:'',to:'',year:'',tipo:'',categoriaId:'',subcategoriaId:'',medio:'',tarjetaId:''};
let dashboardFilter={categoriaId:'',subcategoriaId:''};

const NAV=[
 {id:'dashboard',icon:'⌂',label:'Resumen'},
 {id:'transactions',icon:'↕',label:'Movimientos'},
 {id:'accounts',icon:'▤',label:'Cuentas'},
 {id:'cards',icon:'▣',label:'Tarjetas'},
 {id:'recurring',icon:'↻',label:'Recurrentes'},
 {id:'debts',icon:'◇',label:'Deudas'},
 {id:'planning',icon:'◎',label:'Planificar'},
 {id:'categories',icon:'◫',label:'Categorías'},
 {id:'budgets',icon:'◉',label:'Presupuesto'},
 {id:'control',icon:'✓',label:'Control'},
 {id:'history',icon:'◷',label:'Historial'}
];


function toggleUsdAmount(){const currency=document.getElementById('fMoneda'),field=document.getElementById('usdAmountField'),usd=document.getElementById('fMontoUsd');const show=currency?.value==='USD';if(field)field.style.display=show?'block':'none';if(!show&&usd)usd.value=''}

function initNav(){
 const side=document.getElementById('sideNav'), bottom=document.getElementById('bottomNav');
 side.innerHTML=NAV.map(n=>`<button id="nav-${n.id}" onclick="go('${n.id}')"><span class="ico">${n.icon}</span>${n.label}</button>`).join('');
 bottom.innerHTML=NAV.slice(0,5).map(n=>`<button id="bnav-${n.id}" onclick="go('${n.id}')"><span>${n.icon}</span>${n.label}</button>`).join('');
}
function go(v){
 if(v!=='home'&&!state.mesId){showLanding();return}
 document.body.classList.remove('landing-mode');currentView=v;if(v!=='dashboard'){window.__categoryDrill='';dashboardFilter={categoriaId:'',subcategoriaId:''}}
 document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById('view-'+v).classList.add('active');document.querySelectorAll('.nav button,.bottom-nav button').forEach(x=>x.classList.remove('active'));document.getElementById('nav-'+v)?.classList.add('active');document.getElementById('bnav-'+v)?.classList.add('active');const n=NAV.find(x=>x.id===v);document.getElementById('pageTitle').textContent=n.label;document.getElementById('pageSubtitle').textContent={dashboard:'Tu situación financiera de este mes',transactions:'Ingresos y gastos con filtros avanzados',categories:'Organizá tus gastos',budgets:'Controlá cuánto podés gastar',cards:'Consumos, resúmenes y compromisos futuros',recurring:'Suscripciones, seguros y pagos que se repiten',debts:'Cuentas por pagar y pagos pendientes',accounts:'Dónde está tu dinero y transferencias internas',planning:'Objetivos, reservas y futuro',control:'Diagnóstico, reglas y cierre de mes',history:'Meses anteriores'}[v];render();if(v==='history')loadHistory();
}

async function loadHistory(){try{const h=await api('getHistorial');state.historial=h.historial||[];renderHistory()}catch(e){toast(e.message,'err')}}

function money(n){return new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(n)||0)}
function formatMoney(n){return new Intl.NumberFormat('es-AR',{maximumFractionDigits:0}).format(Number(n)||0)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Argentina/Buenos_Aires',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function formatDateDisplay(value){
  const s=String(value||'').slice(0,10);
  const m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m?`${m[3]}/${m[2]}/${m[1]}`:(value||'—');
}
function monthNow(){return today().slice(0,7)}
function toast(msg,type='ok'){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show '+type;clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.className='toast',3000)}
function setBusy(v){busy=v}
function api(action,params={}){
 return new Promise((resolve,reject)=>{
   if(API.includes('PEGAR_AQUI')) return reject(new Error('Falta configurar la URL del Web App'));
   const finalParams={...params};
   const publicActions=new Set(['getMeses','crearMes','renombrarMes','getHistorial','hacerBackup']);
   if(state.mesId && !publicActions.has(action)) finalParams.mesId=state.mesId;
   const callback='fin_cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);
   const q=new URLSearchParams({action,callback,...Object.fromEntries(Object.entries(finalParams).map(([k,v])=>[k,typeof v==='object'?JSON.stringify(v):String(v)]))});
   const script=document.createElement('script');
   const timer=setTimeout(()=>{cleanup();reject(new Error('Tiempo de espera agotado'))},15000);
   function cleanup(){clearTimeout(timer);delete window[callback];script.remove()}
   window[callback]=(data)=>{cleanup();if(data?.ok===false)reject(new Error(data.error||'Error'));else resolve(data)};
   script.onerror=()=>{cleanup();reject(new Error('No se pudo conectar con Google Sheets'))};
   script.src=API+'?'+q.toString();
   document.body.appendChild(script);
 });
}

async function load(){
 try{
   if(!state.mesId) return showLanding();
   const d=await api('getDatos');
   state={...state,...d};
    ['ingresos','gastos','categorias','subcategorias','tarjetas','recurrentes','deudas','cuentas','objetivos','reservas','reglas','porCobrar','transferencias','cierres','consumosSinAsignar','historial'].forEach(k=>{if(!Array.isArray(state[k]))state[k]=[]});
    if(!state.presupuestos||typeof state.presupuestos!=='object')state.presupuestos={};
    if(!state.balance||typeof state.balance!=='object')state.balance={};
    if(!state.meta||typeof state.meta!=='object')state.meta={};
   if(currentView==='history'){const history=await api('getHistorial');state.historial=history.historial||[];}
   updateCurrentMonthUI();
   render();
 }catch(e){toast(e.message,'err')}
}
async function mutate(action,params={},success='Guardado'){
 try{setBusy(true);await api(action,params);await load();toast(success)}catch(e){toast(e.message,'err')}finally{setBusy(false)}
}
function updateCurrentMonthUI(){
 const b=document.getElementById('currentMonthBadge');
 if(b)b.textContent=state.mes||'Sin mes';
}
async function showLanding(){
 currentView='home';
 document.body.classList.add('landing-mode');
 document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
 const home=document.getElementById('view-home');home.classList.add('active');
 try{
   const d=await api('getMeses');
   monthCache=d.meses||[];
   renderLanding(monthCache);
 }catch(e){renderLanding([]);toast(e.message,'err')}
}
function renderLanding(months){
 const home=document.getElementById('view-home');
 home.innerHTML=`<div class="landing"><div class="landing-inner">
   <div class="landing-brand"><div class="brand-mark">₣</div><div><h1 class="landing-title">Finanzas Pro</h1><p class="landing-sub">Elegí el mes con el que querés trabajar.</p></div></div>
   ${months.length?`<div class="month-grid">${months.map(m=>`<button class="month-card" onclick="selectMonth('${esc(m.id)}')"><span class="month-icon">◷</span><h3>${esc(m.nombre)}</h3><p>Todo lo que cargues queda guardado dentro de este mes.</p></button>`).join('')}
   <button class="month-card month-create" onclick="openCreateMonth()"><span class="month-icon">+</span><h3>Crear nuevo mes</h3><p>Empezá un período completamente independiente.</p></button></div>`
   :`<div class="landing-empty"><strong>Todavía no existe ningún mes.</strong><p class="muted">Para empezar, creá tu primer mes. Después, todo lo que cargues quedará guardado dentro de él.</p><button class="btn btn-primary" onclick="openCreateMonth()">+ Crear mi primer mes</button></div>`}
 </div></div>`;
}
async function selectMonth(mesId){
 try{
   let m=monthCache.find(x=>x.id===mesId);
   if(!m){const months=await api('getMeses');monthCache=months.meses||[];m=monthCache.find(x=>x.id===mesId);}
   if(!m)throw new Error('Ese mes ya no existe');
   state={mesId:m.id,mes:m.nombre,ingresos:[],gastos:[],categorias:[],subcategorias:[],tarjetas:[],recurrentes:[],deudas:[],cuentas:[],objetivos:[],reservas:[],reglas:[],porCobrar:[],transferencias:[],cierres:[],consumosSinAsignar:[],presupuestos:{},balance:{},meta:{},historial:[]};
   localStorage.setItem('fp-last-month',m.id);
   document.body.classList.remove('landing-mode');
   updateCurrentMonthUI();
   go('dashboard');
   await load();
 }catch(e){toast(e.message,'err')}
}
function openCreateMonth(){
 openModal('Crear nuevo mes',`<div class="field"><label>Nombre del mes</label><input id="newMonthName" placeholder="Ej.: Agosto 2026" autofocus></div><p class="muted" style="margin:10px 0 0">Este mes tendrá sus propias categorías, tarjetas, presupuestos, movimientos y recurrentes.</p><div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="createMonth()">Crear mes</button></div>`);
 setTimeout(()=>document.getElementById('newMonthName')?.focus(),50);
}
async function createMonth(){
 const nombre=document.getElementById('newMonthName')?.value.trim();
 if(!nombre)return toast('Escribí el nombre del mes','err');
 try{
   const d=await api('crearMes',{nombre});
   closeModal();
   state={mesId:d.mes.id,mes:d.mes.nombre,ingresos:[],gastos:[],categorias:[],subcategorias:[],tarjetas:[],recurrentes:[],deudas:[],cuentas:[],objetivos:[],reservas:[],reglas:[],porCobrar:[],transferencias:[],cierres:[],consumosSinAsignar:[],presupuestos:{},balance:{},meta:{},historial:[]};
   localStorage.setItem('fp-last-month',d.mes.id);
   document.body.classList.remove('landing-mode');
   updateCurrentMonthUI();
   go('dashboard');
   await load();
   toast('Mes creado');
 }catch(e){toast(e.message,'err')}
}
async function changeMonth(){await showLanding()}

async function backup(){try{const d=await api('hacerBackup');if(d.url)window.open(d.url,'_blank');toast('Backup creado')}catch(e){toast(e.message,'err')}}
function toggleTheme(){const b=document.body;const t=b.dataset.theme==='dark'?'light':'dark';b.dataset.theme=t;localStorage.setItem('fp-theme',t);renderCharts()}
function initTheme(){document.body.dataset.theme=localStorage.getItem('fp-theme')||'light'}

function render(){updateCurrentMonthUI();const map={dashboard:renderDashboard,transactions:renderTransactions,accounts:renderAccounts,categories:renderCategories,budgets:renderBudgets,cards:renderCards,recurring:renderRecurring,debts:renderDebts,planning:renderPlanning,control:renderControl,history:renderHistory};(map[currentView]||renderDashboard)();if(currentView==='dashboard')setTimeout(renderCharts,0)}

function status(){
 const b=state.balance||{};const disponible=Number(b.disponible)||0;
 const gastos=Number(b.gastosPagados)||0;const presupuesto=Object.values(state.presupuestos||{}).reduce((a,x)=>a+Number(x||0),0);
 if(disponible<0)return {c:'negative',t:'Vas a cerrar en negativo'};
 if(presupuesto>0 && gastos/presupuesto>.9)return {c:'warning',t:'Estás cerca del límite'};
 return {c:'positive',t:'Vas bien para llegar a fin de mes'};
}

function dateMonth(value){const m=String(value||'').match(/^(\d{4})-(\d{2})/);return m?`${m[1]}-${m[2]}`:''}
function movementAmount(x){return Number(x?.monto||0)}
function isCurrentConsumption(g){const mk=state.meta?.monthKey||'';if(!mk)return true;if(g.tarjetaId)return String(g.resumenMes||'')===mk;const d=dateMonth(g.fecha||g.fechaCompra);return d?d===mk:true}
function movementSplits(x){if(Array.isArray(x?.medios)&&x.medios.length)return x.medios;const m=String(x?.medio||'').toLowerCase();return x?.monto&&m?[{medio:m,monto:Number(x.monto)||0,tarjetaId:x.tarjetaId||''}]:x?.tarjetaId?[{medio:'tarjeta',monto:Number(x.monto)||0,tarjetaId:x.tarjetaId}]:[]}
function medioLabel(x){const ms=movementSplits(x);if(ms.length>1)return 'Combinado';const m=ms[0]?.medio||String(x?.medio||'').toLowerCase();if(m==='efectivo')return 'Efectivo';if(m==='transferencia')return 'Transferencia';if(m==='tarjeta'||x?.tarjetaId)return 'Tarjeta';if(m==='otro')return 'Otro';return 'Sin especificar'}
function splitBadges(x){const ms=movementSplits(x);if(!ms.length)return `<span class="method-badge otherpay">Sin especificar</span>`;return ms.map(m=>`<span class="method-badge ${m.medio==='efectivo'?'cash':m.medio==='transferencia'?'transfer':m.medio==='tarjeta'?'cardpay':'otherpay'}">${m.medio==='efectivo'?'Efectivo':m.medio==='transferencia'?'Transferencia':m.medio==='tarjeta'?'Tarjeta':'Otro'} · ${money(m.monto)}</span>${m.medio==='tarjeta'&&m.tarjetaId?` <span class="muted">${esc(cardLabelById(m.tarjetaId))}</span>`:''}`).join(' ')}
function medioClass(x){const ms=movementSplits(x);if(ms.length>1)return 'otherpay';const m=ms[0]?.medio||String(x?.medio||'').toLowerCase();return m==='efectivo'?'cash':m==='transferencia'?'transfer':m==='tarjeta'||x?.tarjetaId?'cardpay':'otherpay'}
function movementRowMethod(x){const ms=movementSplits(x);if(ms.length>1)return 'combined';const m=ms[0]?.medio||'';return m==='tarjeta'?'tarjeta':m==='efectivo'?'efectivo':m==='transferencia'?'transferencia':'otro'}
function monthlyExpenseItems(){
 const mk=state.meta?.monthKey||'',items=[];
 state.gastos.filter(isCurrentConsumption).forEach(g=>{
  const ms=movementSplits(g),directParts=ms.filter(m=>m.medio!=='tarjeta'),direct=directParts.reduce((a,m)=>a+Number(m.monto||0),0);
  if(direct>0)items.push({...g,id:`direct-${g.id}`,tipo:'gasto',source:'directo',monto:direct,tarjetaId:'',medio:directParts.length>1?'combinado':(directParts[0]?.medio||g.medio)});
 });
 state.tarjetas.forEach(c=>{
  const r=(c.resumenes||[]).find(x=>x.mes===mk);if(!r)return;
  (r.items||[]).forEach((it,i)=>items.push({id:`summary-${c.id}-${i}-${mk}`,tipo:'gasto',source:'resumen',concepto:it.concepto,monto:Number(it.monto||0),categoriaId:it.categoriaId||'',subcategoriaId:it.subcategoriaId||'',tarjetaId:c.id,medio:'tarjeta',medios:[{medio:'tarjeta',monto:Number(it.monto||0),tarjetaId:c.id}],fecha:c.vencimiento||`${mk}-28`,fechaCompra:it.fechaCompra||'',resumenMes:mk,cuotaActual:it.cuota||0,cuotasTotal:it.cuotasTotal||0,tarjetaLabel:cardLabelById(c.id)}));
 });
 return items
}

function cardLabelById(id){
  const cards=Array.isArray(state.tarjetas)?state.tarjetas:[];
  const c=cards.find(t=>String(t.id)===String(id));
  if(!c)return '';
  const banco=String(c.banco||'').trim();
  const nombre=String(c.nombre||c.concepto||'Tarjeta').trim();
  const last4=String(c.ultimos4||'').trim();
  return `${banco?banco+' · ':''}${nombre}${last4?' • '+last4:''}`;
}

function dashboardMovementHtml(){const all=dashboardMovements();if(!all.length)return '<div class="empty">No hay movimientos para esta selección.</div>';return `<div class="card-list">${all.map(x=>`<div class="list-card"><div class="list-main"><div class="list-title">${esc(x.concepto)}</div><div class="list-meta">${formatDateDisplay(x.fecha)} · ${x.tipo==='ingreso'?'Ingreso':categoryLabel(x)}${x.tipo==='gasto'?' · '+medioLabel(x):''}${x.source==='resumen'?` · ${esc(x.tarjetaLabel||'Resumen de tarjeta')}`:''}</div></div><strong class="${x.tipo==='ingreso'?'positive':'negative'}">${x.tipo==='ingreso'?'+':'−'}${money(x.monto)}</strong></div>`).join('')}</div>`}
function renderDashboardMovementList(){const box=document.getElementById('dashboardMovementsBody'),title=document.getElementById('dashboardMovementsTitle'),clear=document.getElementById('dashboardFilterClear');if(box)box.innerHTML=dashboardMovementHtml();const cat=(state.categorias||[]).find(c=>c.id===dashboardFilter.categoriaId),sub=(state.subcategorias||[]).find(x=>x.id===dashboardFilter.subcategoriaId);if(title)title.textContent=cat?`Movimientos · ${cat.nombre}${sub?' → '+sub.nombre:''}`:'Últimos movimientos';if(clear)clear.style.display=cat?'inline-flex':'none'}
function upcomingPayments(){const items=[];state.tarjetas.forEach(c=>{if(c.vencimiento&&Number(c.resumenActual)>0)items.push({date:c.vencimiento,name:`${c.banco?c.banco+' · ':''}${c.nombre}`,amount:c.resumenActual,type:'Tarjeta'})});state.recurrentes.filter(r=>r.tipo==='gasto').forEach(r=>{const mk=state.meta?.monthKey;if(!mk)return;items.push({date:`${mk}-${String(Math.min(28,Number(r.dia)||1)).padStart(2,'0')}`,name:r.concepto,amount:r.monto,type:r.autoDebito?'Débito automático':'Recurrente'})});items.sort((a,b)=>String(a.date).localeCompare(String(b.date)));return items.slice(0,7)}
function daysFromToday(date){if(!/^\d{4}-\d{2}-\d{2}$/.test(String(date||'')))return null;const a=new Date(today()+'T12:00:00'),b=new Date(String(date).slice(0,10)+'T12:00:00');return Math.round((b-a)/86400000)}
function financialAlerts(){
 const out=[],seen=new Set(),push=x=>{const k=[x.kind,x.id||'',x.date||'',x.title||''].join('|');if(!seen.has(k)){seen.add(k);out.push(x)}};
 (state.tarjetas||[]).forEach(c=>{
   const label=cardLabelById(c.id),closeDiff=daysFromToday(c.cierre),dueDiff=daysFromToday(c.vencimiento);
   if(closeDiff!==null&&closeDiff>=0&&closeDiff<=7)push({kind:'cierre',id:c.id,date:c.cierre,diff:closeDiff,icon:'✂️',title:`${label} cierra ${closeDiff===0?'hoy':closeDiff===1?'mañana':`en ${closeDiff} días`}`,meta:'Las compras posteriores pasan al próximo ciclo.',amount:0,action:`editCard('${c.id}')`,level:closeDiff<=1?'warning':''});
   if(dueDiff!==null&&dueDiff<=14&&Number(c.resumenActual||0)>0)push({kind:'vencimiento',id:c.id,date:c.vencimiento,diff:dueDiff,icon:'💳',title:dueDiff<0?`${label} está vencida`:dueDiff===0?`${label} vence hoy`:dueDiff===1?`${label} vence mañana`:`${label} vence en ${dueDiff} días`,meta:formatDateDisplay(c.vencimiento),amount:Number(c.resumenActual||0),action:`go('cards')`,level:dueDiff<=1?'urgent':dueDiff<=5?'warning':''});
   (c.resumenes||[]).forEach(r=>(r.items||[]).forEach(it=>{if(Number(it.cuotasTotal||0)>1&&Number(it.cuota||0)===Number(it.cuotasTotal||0)&&r.mes>=String(state.meta?.monthKey||''))push({kind:'ultima',id:`${c.id}-${it.concepto}-${r.mes}`,date:`${r.mes}-01`,diff:999,icon:'🎉',title:`${it.concepto} termina en ${r.label}`,meta:`Última cuota ${it.cuota}/${it.cuotasTotal} · ${label}`,amount:Number(it.monto||0),action:`go('cards')`,level:'good'});if(Number(it.cuotasTotal||0)>1&&Number(it.cuota||0)===1&&r.mes>=String(state.meta?.monthKey||''))push({kind:'primera',id:`${c.id}-${it.concepto}-${r.mes}`,date:`${r.mes}-01`,diff:999,icon:'🆕',title:`Empieza ${it.concepto}`,meta:`Primera cuota 1/${it.cuotasTotal} · ${r.label} · ${label}`,amount:Number(it.monto||0),action:`go('cards')`,level:''})}));
 });
 (state.recurrentes||[]).filter(r=>r.tipo==='gasto').forEach(r=>{const mk=state.meta?.monthKey;if(!mk)return;const day=String(Math.min(28,Math.max(1,Number(r.dia)||1))).padStart(2,'0'),date=`${mk}-${day}`,d=daysFromToday(date);if(d!==null&&d>=0&&d<=14)push({kind:'recurrente',id:r.id,date,diff:d,icon:'🔁',title:`${r.concepto} ${d===0?'se espera hoy':d===1?'se espera mañana':`se espera en ${d} días`}`,meta:`${r.autoDebito?'Débito automático':'Pago recurrente'}${r.tarjetaId?' · '+cardLabelById(r.tarjetaId):''}`,amount:Number(r.monto||0),action:`editRecurring('${r.id}')`,level:d<=1?'warning':''})});
 (state.deudas||[]).forEach(d=>{const date=d.vencimientoDeuda||d.vencimiento,diff=daysFromToday(date),saldo=Number(d.saldoPendiente||d.monto||0);if(date&&saldo>0&&diff!==null&&diff<=30)push({kind:'deuda',id:d.id,date,diff,icon:'🤝',title:diff<0?`${d.concepto} está vencida`:diff===0?`${d.concepto} vence hoy`:diff===1?`${d.concepto} vence mañana`:`${d.concepto} vence en ${diff} días`,meta:`${d.acreedor||'Deuda pendiente'} · ${formatDateDisplay(date)}`,amount:saldo,action:`openDebt(state.deudas.find(x=>x.id==='${d.id}'))`,level:diff<=0?'urgent':diff<=5?'warning':''})});
 return out.sort((a,b)=>{const rank=x=>x.diff<0?-1000+x.diff:x.diff;return rank(a)-rank(b)});
}

function filteredTransactions(){let all=[...state.ingresos.map(x=>({...x,tipo:'ingreso'})),...state.gastos.map(x=>({...x,tipo:'gasto'}))];return all.filter(x=>{const q=txFilters.q.toLowerCase().trim(),text=(x.concepto+' '+(x.tipo==='gasto'?categoryLabel(x):'')+' '+medioLabel(x)+' '+movementSplits(x).map(m=>cardLabelById(m.tarjetaId)).join(' ')).toLowerCase();if(q&&!text.includes(q))return false;if(txFilters.from&&String(x.fecha)<txFilters.from)return false;if(txFilters.to&&String(x.fecha)>txFilters.to)return false;if(txFilters.year&&String(x.fecha).slice(0,4)!==txFilters.year)return false;if(txFilters.tipo&&x.tipo!==txFilters.tipo)return false;if(txFilters.categoriaId&&(x.tipo!=='gasto'||x.categoriaId!==txFilters.categoriaId))return false;if(txFilters.subcategoriaId&&(x.tipo!=='gasto'||x.subcategoriaId!==txFilters.subcategoriaId))return false;const ms=movementSplits(x);if(txFilters.medio==='no_tarjeta'){if(x.tipo!=='gasto'||ms.some(m=>m.medio==='tarjeta'))return false}else if(txFilters.medio&&!ms.some(m=>m.medio===txFilters.medio))return false;if(txFilters.tarjetaId&&!ms.some(m=>m.tarjetaId===txFilters.tarjetaId))return false;return true}).sort((a,b)=>String(b.fecha||'').localeCompare(String(a.fecha||'')))}

function formatMoneyInput(el){
  if(!el)return;
  let v=String(el.value||'').replace(/\s/g,'').replace(/[^0-9,]/g,'');
  const parts=v.split(',');
  let integer=(parts[0]||'').replace(/^0+(?=\d)/,'');
  const decimal=parts.length>1?','+(parts[1]||'').slice(0,2):'';
  integer=integer.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  el.value=integer+decimal;
}
function parseMoneyInput(value){
  const v=String(value??'').replace(/\./g,'').replace(',','.');
  return Number(v)||0;
}

function n(v){return Number(v)||0}
function pct(v){return `${Math.round(n(v))}%`}
function addMonthClient(mk,off){const m=String(mk||'').match(/^(\d{4})-(\d{2})$/);if(!m)return '';const d=new Date(Number(m[1]),Number(m[2])-1+off,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function monthLabelClient(mk){const m=String(mk||'').match(/^(\d{4})-(\d{2})$/);if(!m)return mk||'—';return new Intl.DateTimeFormat('es-AR',{month:'long',year:'numeric'}).format(new Date(Number(m[1]),Number(m[2])-1,1)).replace(/^./,x=>x.toUpperCase())}
function totalRecurrentes(){return (state.recurrentes||[]).filter(r=>r.tipo==='gasto').reduce((a,r)=>a+n(r.monto),0)}
function annualRecurring(){return totalRecurrentes()*12}
function pendingDebt(){return (state.deudas||[]).reduce((a,d)=>a+n(d.saldoPendiente||d.monto),0)}
function pendingReceivables(){return (state.porCobrar||[]).reduce((a,d)=>a+n(d.saldoCobrar||d.monto),0)}
function reservedTotal(){return (state.reservas||[]).reduce((a,r)=>a+n(r.montoReserva||r.monto),0)}
function knownFuture(off=1){const mk=addMonthClient(state.meta?.monthKey,off);return (state.tarjetas||[]).reduce((a,c)=>{const r=(c.resumenes||[]).find(x=>x.mes===mk);return a+n(r?.total)},0)}
function financialHealth(){const b=state.balance||{},inc=n(b.ingresosCobrados),ob=n(b.tarjetas)+pendingDebt()+totalRecurrentes(),ratio=inc?ob/inc*100:0,free=n(b.libreEstimado ?? b.disponible)-totalRecurrentes();return {inc,ob,ratio,free,status:free<0?'negative':ratio>80?'warning':'positive',label:free<0?'Mes comprometido':ratio>80?'Compromisos altos':'Posición controlada'}}
function smartNotes(){const h=financialHealth(),notes=[];if(h.inc)notes.push(`Tenés ${pct(h.ratio)} de tus ingresos actuales comprometidos entre tarjetas, deudas y recurrentes.`);const ending=[];(state.tarjetas||[]).forEach(c=>(c.resumenes||[]).forEach(r=>(r.items||[]).filter(i=>i.cuotasTotal>1&&i.cuota===i.cuotasTotal).forEach(i=>ending.push(`${i.concepto} termina en ${r.label}`))));if(ending.length)notes.push(`${ending.slice(0,2).join(' · ')}.`);const subs=totalRecurrentes();if(subs)notes.push(`Tus recurrentes representan ${money(subs)} por mes (~${money(subs*12)} al año).`);if((state.consumosSinAsignar||[]).length)notes.push(`${state.consumosSinAsignar.length} consumo(s) de tarjeta necesitan revisión de ciclo.`);return notes.slice(0,4)}
function projectionRows(){return Array.from({length:6},(_,i)=>{const mk=addMonthClient(state.meta?.monthKey,i),cards=(state.tarjetas||[]).reduce((a,c)=>{const r=(c.resumenes||[]).find(x=>x.mes===mk);return a+n(r?.total)},0),estimated=i===0?0:totalRecurrentes();return {mk,label:monthLabelClient(mk),confirmado:cards,estimado:estimated,total:cards+estimated}})}
function recurringDetection(r){const key=String(r.matchTerms||r.proveedor||r.concepto||'').toLowerCase().trim();if(!key)return {found:false};const matches=(state.gastos||[]).filter(g=>String(g.concepto||'').toLowerCase().includes(key)||String(g.proveedor||'').toLowerCase().includes(key));const current=matches.filter(g=>String(g.fecha||'').slice(0,7)===state.meta?.monthKey);return {found:current.length>0,count:current.length,last:current.sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)))[0]}}

function diagnostics(){const out=[];(state.tarjetas||[]).filter(c=>!c.calendarioCompleto).forEach(c=>out.push({level:'error',text:`${cardLabelById(c.id)} sin calendario completo`}));(state.consumosSinAsignar||[]).forEach(x=>out.push({level:'error',text:`${x.concepto}: consumo sin resumen determinado`}));(state.gastos||[]).filter(g=>!movementSplits(g).length).forEach(g=>out.push({level:'warn',text:`${g.concepto}: medio de pago no especificado`}));(state.gastos||[]).filter(g=>!g.categoriaId).forEach(g=>out.push({level:'warn',text:`${g.concepto}: sin categoría`}));const dup=new Map();[...(state.gastos||[]),...(state.ingresos||[])].forEach(x=>{const k=`${x.fecha}|${String(x.concepto).toLowerCase()}|${n(x.monto).toFixed(2)}`;dup.set(k,(dup.get(k)||0)+1)});[...dup].filter(([,c])=>c>1).forEach(([k,c])=>out.push({level:'warn',text:`Posible duplicado (${c}×): ${k.split('|')[1]} · ${money(k.split('|')[2])}`}));return out}

rr');await mutate(id?(ing?'actualizarIngreso':'actualizarGasto'):(ing?'agregarIngreso':'agregarGasto'),p,ing?'Ingreso guardado':'Gasto guardado');if(!id&&!ing&&p.pagoPor==='yo'&&p.splitPareja>0){const share=sum*p.splitPareja/100;await api('agregarPorCobrar',{mesId:state.mesId,nombre:'Parte compartida · '+p.concepto,deudor:'Dai',monto:share,saldoCobrar:share,fechaCobro:''});await load();toast('Gasto guardado y cuenta por cobrar creada')}closeModal()}

function accountOptions(selected=''){return `<option value="">Sin cuenta específica</option>${(state.cuentas||[]).map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${esc(c.nombre)}</option>`).join('')}`}

splitMethodChanged=function(sel){const row=sel.closest('[data-split]'),cw=row?.querySelector('[data-split-card-wrap]'),aw=row?.querySelector('[data-split-account-wrap]'),card=row?.querySelector('[data-split-card]'),account=row?.querySelector('[data-split-account]');if(cw)cw.style.display=sel.value==='tarjeta'?'block':'none';if(aw)aw.style.display=['efectivo','transferencia'].includes(sel.value)?'block':'none';if(sel.value!=='tarjeta'&&card)card.value='';if(!['efectivo','transferencia'].includes(sel.value)&&account)account.value='';togglePaymentFields();updateSplitTotal();recalcPurchaseTotal()}
collectPaymentSplits=function(){return [...document.querySelectorAll('[data-split]')].map(r=>({medio:r.querySelector('[data-split-method]')?.value||'',monto:parseMoneyInput(r.querySelector('[data-split-amount]')?.value||''),tarjetaId:r.querySelector('[data-split-card]')?.value||'',cuentaId:r.querySelector('[data-split-account]')?.value||''})).filter(x=>x.medio&&x.monto>0)}

renderPlanning=function(){const goals=state.objetivos||[],res=state.reservas||[],proj=Array.from({length:12},(_,i)=>{const mk=addMonthClient(state.meta?.monthKey,i),cards=(state.tarjetas||[]).reduce((a,c)=>a+n((c.resumenes||[]).find(x=>x.mes===mk)?.total),0),estimated=i===0?0:totalRecurrentes();return {mk,label:monthLabelClient(mk),confirmado:cards,total:cards+estimated}});document.getElementById('view-planning').innerHTML=`<div class="toolbar"><div><h2 style="margin:0">Planificación</h2><span class="muted">Objetivos, reservas, proyección anual y tu yo futuro.</span></div><div class="actions"><button class="btn btn-secondary" onclick="openReserve()">+ Reserva</button><button class="btn btn-primary" onclick="openGoal()">+ Objetivo</button></div></div><div class="card"><div class="card-head"><h2>Proyección 12 meses</h2></div><div class="card-body"><div class="future-strip twelve">${proj.map(p=>`<div><span>${esc(p.label)}</span><strong>${money(p.total)}</strong><small>${money(p.confirmado)} confirmado</small></div>`).join('')}</div></div></div><div class="dashboard-grid"><div class="card"><div class="card-head"><h2>Objetivos</h2></div><div class="card-body">${goals.length?goals.map(g=>{const target=n(g.montoObjetivo||g.monto),saved=n(g.montoAhorrado),pp=target?Math.min(100,saved/target*100):0;return `<div class="goal"><div class="goal-top"><strong>${esc(g.nombre)}</strong><span>${money(saved)} / ${money(target)}</span></div><div class="progress"><span style="width:${pp}%"></span></div><div class="list-actions" style="margin-top:8px"><button class="btn btn-secondary btn-small" onclick="openGoal(state.objetivos.find(x=>x.id==='${g.id}'))">Editar</button><button class="btn btn-danger btn-small" onclick="remove('eliminarObjetivo',{id:'${g.id}'},'Objetivo archivado')">Eliminar</button></div></div>`}).join(''):'<div class="empty">Sin objetivos.</div>'}</div></div><div class="card"><div class="card-head"><h2>Fondos reservados</h2></div><div class="card-body">${res.length?res.map(r=>`<div class="kpi-row"><span><strong>${esc(r.nombre)}</strong><br><small class="muted">${r.fechaReserva?'Para '+formatDateDisplay(r.fechaReserva):'Sin fecha'}</small></span><span style="text-align:right"><strong>${money(r.montoReserva||r.monto)}</strong><br><button class="btn btn-secondary btn-small" onclick="openReserve(state.reservas.find(x=>x.id==='${r.id}'))">Editar</button> <button class="btn btn-danger btn-small" onclick="remove('eliminarReserva',{id:'${r.id}'},'Reserva archivada')">Eliminar</button></span></div>`).join(''):'<div class="empty">No reservaste fondos.</div>'}</div></div></div><div class="card"><div class="card-head"><h2>Tu yo a fin de mes</h2></div><div class="card-body">${futureSelfHtml()}</div></div>`}

filteredTransactions=function(){let all=[...state.ingresos.map(x=>({...x,tipo:'ingreso'})),...state.gastos.map(x=>({...x,tipo:'gasto'}))];return all.filter(x=>{const q=txFilters.q.toLowerCase().trim(),tags=Array.isArray(x.tags)?x.tags.join(' '):String(x.tags||''),text=(x.concepto+' '+(x.proveedor||'')+' '+tags+' '+(x.tipo==='gasto'?categoryLabel(x):'')+' '+medioLabel(x)+' '+cardLabelById(x.tarjetaId)).toLowerCase();if(q&&!text.includes(q))return false;if(txFilters.from&&String(x.fecha)<txFilters.from)return false;if(txFilters.to&&String(x.fecha)>txFilters.to)return false;if(txFilters.year&&String(x.fecha).slice(0,4)!==txFilters.year)return false;if(txFilters.tipo&&x.tipo!==txFilters.tipo)return false;if(txFilters.categoriaId&&(x.tipo!=='gasto'||x.categoriaId!==txFilters.categoriaId))return false;if(txFilters.subcategoriaId&&(x.tipo!=='gasto'||x.subcategoriaId!==txFilters.subcategoriaId))return false;if(txFilters.medio){const splits=movementSplits(x);if(txFilters.medio==='directo'){if(splits.some(s=>s.medio==='tarjeta'))return false}else if(!splits.some(s=>s.medio===txFilters.medio))return false}if(txFilters.tarjetaId&&!movementSplits(x).some(s=>s.tarjetaId===txFilters.tarjetaId))return false;return true}).sort((a,b)=>String(b.fecha||'').localeCompare(String(a.fecha||'')))}



/* V14.2 — consumo económico separado de caja y obligaciones */
function economicExpenseItems(){const mk=state.meta?.monthKey||'';return (state.gastos||[]).filter(g=>!g.noConsumo&&dateMonth(g.fechaCompra||g.fecha)===mk).map(g=>({...g,tipo:'gasto',monto:n(g.montoTotal||g.monto)}))}
categoryTotals=function(){const map={};economicExpenseItems().forEach(g=>{const cat=state.categorias.find(c=>c.id===g.categoriaId);if(!cat)return;map[cat.id]=(map[cat.id]||0)+n(g.monto)});return Object.entries(map).map(([id,total])=>({id,nombre:state.categorias.find(c=>c.id===id)?.nombre||'Sin categoría',total})).filter(x=>x.total>0).sort((a,b)=>b.total-a.total)}
subcategoryTotals=function(catId){const map={};economicExpenseItems().filter(g=>g.categoriaId===catId).forEach(g=>{const sub=(state.subcategorias||[]).find(s=>s.id===g.subcategoriaId),id=g.subcategoriaId||'__sin__';map[id]=map[id]||{id,nombre:sub?.nombre||'Sin subcategoría',total:0};map[id].total+=n(g.monto)});return Object.values(map).sort((a,b)=>b.total-a.total)}
dashboardMovements=function(){let all;if(dashboardFilter.categoriaId){all=economicExpenseItems().filter(g=>g.categoriaId===dashboardFilter.categoriaId&&(!dashboardFilter.subcategoriaId||g.subcategoriaId===dashboardFilter.subcategoriaId))}else all=[...state.ingresos.filter(x=>!x.noIngresoEconomico).map(x=>({...x,tipo:'ingreso'})),...economicExpenseItems()];all.sort((a,b)=>String(b.fecha||'').localeCompare(String(a.fecha||'')));return all.slice(0,dashboardFilter.categoriaId?50:10)}
const __renderDashboardV14=renderDashboard;
renderDashboard=function(){__renderDashboardV14();const cards=[...document.querySelectorAll('#view-dashboard .stat')];if(cards[0]){const v=cards[0].querySelector('.value'),sub=cards[0].querySelector('.sub');if(v)v.textContent=money(economicExpenseItems().reduce((a,x)=>a+n(x.monto),0));if(sub)sub.textContent='Compras y consumos ocurridos en el mes'}}
const __renderChartsV14=renderCharts;
renderCharts=function(){__renderChartsV14();if(charts.flow){charts.flow.data.datasets[0].data[1]=economicExpenseItems().reduce((a,x)=>a+n(x.monto),0);charts.flow.update()}}


window.addEventListener('load',async()=>{initTheme();initNav();await showLanding()});
</script>
